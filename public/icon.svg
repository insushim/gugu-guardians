  <rect width="64" height="64" rx="14" fill="#1B4F8C"/>
  <circle cx="32" cy="32" r="21" fill="#D4342F" stroke="#221D1A" stroke-width="3"/>
  <text x="32" y="33" font-size="26" font-weight="700" fill="#FAF6EE"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Apple SD Gothic Neo','Malgun Gothic',serif">龜</text>
</svg>
