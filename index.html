<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1B4F8C" />
<meta name="description" content="구구성 수호대 — 계산이 빨라질수록 내 군대가 강해지는 초등 연산 디펜스 게임. 로그인 없이 바로 플레이." />
<title>구구성 수호대</title>
<link rel="icon" href="./favicon.png" sizes="32x32" type="image/png" />
<link rel="icon" href="./favicon-48.png" sizes="48x48" type="image/png" />
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<!-- 아이폰 사파리에는 요소 전체화면 API가 없다(src/ui/fullscreen.ts 머리말).
     그 기기에서 주소창을 없애는 유일한 길이 '홈 화면에 추가'라 여기서 열어 둔다. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="구구성 수호대" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app" aria-live="polite">
  <div class="boot">불러오는 중…</div>
</div>

<div id="rotate-hint" hidden>
  <div>
    <div class="rot-icon" aria-hidden="true">📱↻</div>
    <p><strong>기기를 가로로 돌려 주세요</strong></p>
    <p class="sub">넓은 화면에서 더 잘 보여요</p>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
